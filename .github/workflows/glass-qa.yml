name: Temporary glass surface QA
on:
  push:
    branches: [qa/soft-glass-surface]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/ui-standardization.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-qa
          path: test-results
          retention-days: 3
