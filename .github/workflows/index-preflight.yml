name: Regional index demand preflight
on:
  push:
    branches: [index-preflight-20261115]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/regional-demand.spec.js tests/browser/regional-song.spec.js tests/browser/ui-standardization.spec.js --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-preflight-evidence
          path: test-results
          retention-days: 3
