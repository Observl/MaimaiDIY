name: Visual polish preview only
on:
  push:
    branches: [visual-polish-preview-20261115]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node preview/capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-polish-preview
          path: polish-evidence
          retention-days: 3
