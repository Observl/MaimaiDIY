<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171821">
  <title>MaimaiDIY · 舞萌上屏装饰模拟器</title>
  <link rel="icon" href="assets/avatar.png">
  <link rel="preload" href="assets/fonts/MorisawaUDShinGoGb4B-site.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="styles.css?v=1.0.1-support">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">MAIMAI DX</p>
        <h1>上屏装饰模拟器</h1>
        <p class="subtitle">组合素材、控制显示，并导出 2160 × 904 高清图片。</p>
      </div>
      <div class="hero-side">
        <span id="asset-status" class="status is-loading"><i></i> 正在连接素材库</span>
        <a class="support-link" href="support.html">支持项目</a>
      </div>
    </header>

    <section class="preview-card card">
      <div class="section-head">
        <h2>实时预览</h2>
        <span>预览 1080 × 452 · 导出 2160 × 904</span>
      </div>
      <div class="canvas-shell">
        <canvas id="preview" width="1080" height="452" aria-label="舞萌上屏合成预览"></canvas>
        <div id="loading" class="loading" hidden>正在合成…</div>
      </div>
      <div class="toolbar">
        <div class="history-tools" aria-label="编辑历史">
          <button id="undo" class="history-button" type="button" aria-label="撤回" title="撤回" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5M5 12h8a6 6 0 0 1 6 6"/></svg>
          </button>
          <button id="redo" class="history-button" type="button" aria-label="重做" title="重做" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 5 5-5 5m4-5h-8a6 6 0 0 0-6 6"/></svg>
          </button>
        </div>
        <button id="reset" class="button secondary" type="button">恢复默认</button>
        <button id="export" class="button primary" type="button">导出高清 PNG</button>
      </div>
    </section>

    <section class="card template-card">
      <div class="section-head">
        <div>
          <h2>本地模板</h2>
          <p>模板保存在当前浏览器中，不会上传名称和头像。</p>
        </div>
      </div>
      <div class="template-tools">
        <label>
          <span>模板名称</span>
          <input id="template-name" type="text" maxlength="30" placeholder="例如：虹框常用配置" autocomplete="off">
        </label>
        <button id="template-save" class="button primary" type="button">保存当前模板</button>
        <label>
          <span>已保存模板</span>
          <select id="template-list"><option value="">暂无模板</option></select>
        </label>
        <button id="template-load" class="button secondary" type="button">载入</button>
        <button id="template-delete" class="button danger" type="button">删除</button>
        <div class="template-io" aria-label="模板文件">
          <button id="template-export" class="button secondary" type="button">导出 JSON</button>
          <label class="button secondary template-import-button">
            导入 JSON
            <input id="template-import" class="file-input" type="file" accept="application/json,.json">
          </label>
        </div>
      </div>
      <p id="template-status" class="template-status" aria-live="polite"></p>
    </section>

    <section class="card controls-card">
      <div class="section-head">
        <div>
          <h2>组件</h2>
          <p>所有组件可从素材库选择；仅头像允许本地上传，要求 1:1 且不超过 720 × 720 像素。</p>
        </div>
      </div>
      <div id="controls" class="controls"></div>
    </section>
  </main>

  <template id="control-template">
    <article class="control-row">
      <div class="control-main">
        <span class="control-icon"></span>
        <div>
          <h3 class="control-label"></h3>
          <p class="control-file">默认素材</p>
        </div>
      </div>
      <div class="control-actions">
        <label class="rating-editor" hidden>
          <span>数值</span>
          <input class="rating-input" type="number" min="0" max="99999" step="1" value="15000" inputmode="numeric">
        </label>
        <label class="name-editor" hidden>
          <span>名称</span>
          <input class="name-input" type="text" maxlength="16" value="maimai" autocomplete="off">
        </label>
        <label class="switch-wrap">
          <span>展示</span>
          <input class="visibility" type="checkbox" checked>
          <i class="switch"></i>
        </label>
        <button class="library-button" type="button">素材库</button>
        <label class="upload-button">
          本地上传
          <input class="file-input" type="file" accept="image/png,image/jpeg,image/webp">
        </label>
      </div>
    </article>
  </template>

  <dialog id="asset-picker" class="asset-picker">
    <div class="picker-head">
      <div>
        <p class="eyebrow">COS ASSETS</p>
        <h2 id="picker-title">选择素材</h2>
        <p id="picker-meta" class="picker-meta"></p>
      </div>
      <button id="picker-close" class="icon-button" type="button" aria-label="关闭">×</button>
    </div>
    <div class="picker-tools">
      <label class="picker-search-wrap">
        <span>搜索</span>
        <input id="picker-search" class="picker-search" type="search" placeholder="搜索名称、编号或获得条件" autocomplete="off">
      </label>
      <label class="picker-filter-wrap">
        <span>分类</span>
        <select id="picker-filter" class="picker-filter">
          <option value="">全部分类</option>
        </select>
      </label>
    </div>
    <div id="picker-message" class="picker-message" hidden></div>
    <div id="picker-grid" class="picker-grid"></div>
    <button id="picker-more" class="button secondary picker-more" type="button" hidden>加载更多</button>
  </dialog>

  <script src="app.js?v=1.0.1-json"></script>
</body>
</html>
