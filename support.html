      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>

      <div class="support-copy">
        <p class="eyebrow">SUPPORT MAIMAIDIY</p>

      </div>

      <figure class="support-qr-wrap">
        <img src="assets/support-qr.jpg" width="1152" height="1152" alt="用于支持 MaimaiDIY 服务器维护的赞赏二维码">
        <figcaption>使用微信扫描二维码进行赞赏</figcaption>
        <a class="qr-original-link" href="assets/support-qr.jpg" target="_blank" rel="noopener">查看二维码原图</a>
