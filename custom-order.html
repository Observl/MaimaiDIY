<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171821">
  <title>定制周边 · MaimaiDIY</title>
  <link rel="icon" href="https://maimai-diy-assets-1517578456.cos.ap-shanghai.myqcloud.com/materials/avatars/UI_Icon_559504.png">
  <link rel="preload" href="https://maimai-diy-assets-1517578456.cos.ap-shanghai.myqcloud.com/materials/fonts/SEGA_MARUGOTHICDB-web.ttf?v=2" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css?v=cleanup-1">
  <link rel="stylesheet" href="BG/Circle%20BG/background.css?v=sega-com-1">
  <link rel="stylesheet" href="BG/Circle%20BG/preview.css?v=cleanup-1">
  <link rel="stylesheet" href="ui-motion.css?v=1">
  <script src="ui-motion.js?v=1" defer></script>
  <script src="background-motion.js" defer></script>
</head>
<body>
  <div class="bg circle" aria-hidden="true"><div class="bg--wrap">
    <div class="bg--pattern"></div>
    <div class="bg--layer">
      <div class="bg--corner bg--corner__top-left"></div><div class="bg--corner bg--corner__top-right"></div>
      <div class="bg--corner bg--corner__bottom-left"></div><div class="bg--corner bg--corner__bottom-right"></div>
      <div class="bg--tile bg--tile__green"></div><div class="bg--tile bg--tile__purple-left"></div><div class="bg--tile bg--tile__purple-right"></div>
      <div class="bg--star bg--star__pink-left"></div><div class="bg--star bg--star__pink-right"></div>
      <div class="bg--star bg--star__yellow-left"></div><div class="bg--star bg--star__yellow-right"></div>
      <div class="bg--circle bg--circle__colorful"></div><div class="bg--circle bg--circle__yellow"></div><div class="bg--circle bg--circle__white"></div>
      <div class="bg--rotation">
        <div class="bg--3d bg--3d__cube-small"></div><div class="bg--3d bg--3d__cube"></div>
        <div class="bg--3d bg--3d__star-small"></div><div class="bg--3d bg--3d__stars"></div>
        <div class="bg--3d bg--3d__glove-blue"></div><div class="bg--3d bg--3d__glove-pink"></div>
        <div class="bg--3d bg--3d__circle-pink"></div><div class="bg--3d bg--3d__circle-orange"></div>
      </div>
    </div>
  </div></div>
  <main class="app-shell order-page">
    <header class="hero">
      <div>
        <h1>定制周边</h1>
      </div>
      <div class="hero-side">
        <button id="background-motion" class="background-motion" type="button" aria-pressed="true">关闭动效</button>
      </div>
      <a class="order-back" href="./">返回编辑器</a>
    </header>
    <section class="preview-card card" aria-labelledby="design-title">
      <div class="section-head"><h2 id="design-title">你的上屏设计</h2></div>
      <p id="design-status" class="template-status" role="status">正在读取最新设计…</p>
      <div class="canvas-shell" id="order-preview-shell" hidden>
        <canvas id="preview" width="1080" height="452" aria-label="用于定制周边的最新上屏设计"></canvas>
      </div>
    </section>
    <section id="acrylic-preview-card" class="card acrylic-preview-card" aria-labelledby="acrylic-preview-title">
      <div class="section-head"><h2 id="acrylic-preview-title">3D 实物预览</h2><div class="acrylic-view-tools"><button id="acrylic-view-detail" class="button secondary" type="button">近景</button><button id="acrylic-view-reset" class="button secondary" type="button">全景</button></div></div>
      <div class="preview-products" role="group" aria-label="展示产品">
        <button type="button" data-preview-product="acrylic" aria-pressed="true">亚克力砖</button>
        <button type="button" data-preview-product="card" aria-pressed="false">镭射卡</button>
        <button type="button" data-preview-product="shikishi" aria-pressed="false">色纸</button>
      </div>
      <div class="acrylic-variants" role="group" aria-label="预览款式">
        <button type="button" data-preview-variant="basic" aria-pressed="false">基础款</button>
        <button type="button" data-preview-variant="effect" aria-pressed="true">特效档</button>
      </div>
      <div id="acrylic-viewport" class="acrylic-viewport"></div>
      <div class="acrylic-light-control"><span id="acrylic-light-label">光照角度</span><div id="acrylic-light-angle" class="light-angle-dial" role="slider" tabindex="0" aria-labelledby="acrylic-light-label" aria-orientation="horizontal" aria-valuemin="-150" aria-valuemax="150" aria-valuenow="0"><span class="light-angle-ticks" aria-hidden="true"></span><span class="light-angle-indicator" aria-hidden="true"></span></div><output id="acrylic-light-value">0°</output></div>
      <p id="acrylic-preview-status" role="status">等待上屏设计</p>
      <p class="acrylic-preview-detail"><span id="acrylic-material-detail">背面彩印 · 白墨</span><span>120 × 50 × 15 mm · 材质示意</span></p>
    </section>
  </main>
  <script type="module" src="src/order-page.js"></script>
</body>
</html>
