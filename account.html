<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号 · MaimaiDIY</title><link rel="stylesheet" href="checkout.css"></head><body><main class="account-shell"><header><a href="./">← 返回编辑器</a><nav><a href="orders.html">我的订单</a><a href="after-sales.html">售后联系</a></nav></header><h1 id="account-title">登录后继续定制。</h1><p>编辑、导入和导出设计无需登录。</p><p id="account-message" role="status" aria-live="polite"></p><section class="panel" id="credentials-panel"><div class="account-tabs" role="group" aria-label="登录方式"><button type="button" id="login-tab" aria-pressed="true">登录</button><button type="button" id="register-tab" class="secondary" aria-pressed="false">注册</button></div><form id="account-form"><label>用户名<input name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9_]{3,32}" autocapitalize="none" spellcheck="false" aria-describedby="username-hint"></label><p id="username-hint">3–32 位字母、数字或下划线，不区分大小写。</p><label>密码<input id="password" name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128"></label><label id="confirm-row" hidden>确认密码<input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" maxlength="128"></label><button id="account-submit" type="submit">登录</button></form><a class="account-help" href="after-sales.html">无法登录？联系售后</a></section><section class="panel" id="signed-in-panel" hidden><h2 id="signed-in-name"></h2><a class="download" id="continue" href="orders.html">继续</a><a class="download" href="orders.html">查看我的订单</a><details><summary>修改密码</summary><form id="password-form"><input name="username" autocomplete="username" type="text" hidden><label>当前密码<input type="password" name="currentPassword" autocomplete="current-password" required minlength="10" maxlength="128"></label><label>新密码<input type="password" name="newPassword" autocomplete="new-password" required minlength="10" maxlength="128"></label><label>确认新密码<input type="password" name="confirmPassword" autocomplete="new-password" required minlength="10" maxlength="128"></label><button type="submit">更新密码</button></form></details><button class="secondary" id="logout" type="button">退出登录</button></section></main><script type="module" src="src/customer-account.js"></script></body></html>
