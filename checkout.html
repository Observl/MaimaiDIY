<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单体验 · MaimaiDIY</title><link rel="stylesheet" href="checkout.css"></head>
<body><main><header><a href="custom-order.html">← 返回选购</a><span class="tag">本地模拟 · 不收款</span></header><h1>完成你的定制。</h1><p id="message" role="status" aria-live="polite">正在载入方案…</p>
<div class="layout"><section class="panel"><h2>你的设计</h2><canvas width="1080" height="452" id="design" aria-label="冻结后的定制设计预览"></canvas><div id="items"></div><div class="total"><span>合计</span><strong id="total">—</strong></div><p>演示订单暂不使用新人优惠，金额由本地订单服务重新核算。</p></section>
<section class="panel"><form id="shipping-form"><h2>收货信息</h2><label>收货人<input name="name" autocomplete="shipping name" required maxlength="40"></label><label>联系电话<input name="phone" type="tel" autocomplete="shipping tel" required minlength="6" maxlength="30"></label><label>完整地址<textarea name="address" autocomplete="shipping street-address" required minlength="6" maxlength="240"></textarea></label><label class="check"><input type="checkbox" name="rights" required><span>我确认设计和收货信息，并拥有本次定制所需的素材使用权限。</span></label><button type="submit">建立模拟订单</button></form>
<div id="order" hidden><h2 id="status">订单状态</h2><p id="order-id"></p><p id="shipping-summary"></p><ol id="timeline"></ol><div id="actions"></div><div id="downloads"></div><button class="secondary" id="reset" type="button">重新选购</button></div></section></div>
<footer>付款、审核、生产和物流均为本机演示。不会向支付平台扣款，也不会把收货信息发送给厂家。生产文件需确认印刷规格后才能正式使用。</footer></main><script type="module" src="src/order-flow.js"></script></body></html>
